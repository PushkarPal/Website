name: Validate responsive layout

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate rendered layout
        run: npx playwright test
      - name: Upload rendered screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rendered-layout-screenshots
          path: test-results/**/*.png
          if-no-files-found: warn
